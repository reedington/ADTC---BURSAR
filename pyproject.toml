[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bursa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "httpx>=0.27"]

[project.scripts]
bursa-web = "bursa.web:main"

[tool.setuptools.packages.find]
include = ["bursa", "bursa.*", "bursa_eval", "bursa_eval.*"]
exclude = ["data*", "docs*", "model*", "tests*"]

[tool.setuptools.package-data]
bursa = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
